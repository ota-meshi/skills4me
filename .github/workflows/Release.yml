name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.repository == 'ota-meshi/skills4me'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' && 'npm run release' || '' }}
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          NPM_CONFIG_PROVENANCE: true
